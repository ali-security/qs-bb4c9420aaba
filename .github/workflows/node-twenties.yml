name: 'Tests: node.js >= 20'

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [26, 24, 22, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2026-08-29T23%3A50%3A15.803000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      - run: npm run tests-only

  pack:
    name: 'npm pack'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2026-08-29T23%3A50%3A15.803000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      # `prepack` (npmignore + `npm run dist`) is what the published tarball is
      # built from, so `npm pack` runs with scripts enabled and `dist/qs.js` is
      # regenerated by browserify exactly as the release was.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qs-tarball
          path: qs-6.16.0.tgz
          if-no-files-found: error

  node:
    name: 'node >= 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
